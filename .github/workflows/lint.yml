name: Lint

on:
  pull_request:
    branches:
      - main

jobs:
  run-linters:
    name: Run linters
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Node.js and dependencies
        uses: ./.github/actions/setup-node-dependencies

      - name: Run linters
        uses: wearerequired/lint-action@v2
        with:
          eslint: true
          prettier: true

  # Runs the same `react-scripts build` Heroku runs at deploy time, so
  # build-breaking lint/compile errors are caught on the PR instead of at
  # the prod push (see MFB-1305 — lint-action alone missed this class of
  # failure because `eslint .` doesn't lint .tsx and uses a different config
  # than the CRA build).
  production-build:
    name: Production build (Heroku parity)
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup Node.js and dependencies
        uses: ./.github/actions/setup-node-dependencies

      - name: Run production build
        run: npm run build
        env:
          # Treat lint warnings as errors (a zero-warning ratchet): any new
          # react-hooks/exhaustive-deps warning fails the PR build instead of
          # silently accumulating. Heroku still deploys fine because it doesn't
          # set CI, so this gate applies to PRs only.
          CI: true
