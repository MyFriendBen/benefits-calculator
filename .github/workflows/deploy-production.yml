name: Deploy to Production

on:
  release:
    types: [published]

jobs:
  verify:
    name: Verify Release Tag
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js and dependencies
        uses: ./.github/actions/setup-node-dependencies

      - name: Run unit tests
        run: npm test -- --coverage --watchAll=false --passWithNoTests

      # Same `react-scripts build` Heroku runs at deploy time, but against the
      # tag being shipped, so a build-breaking error blocks the deploy instead
      # of failing the push to Heroku. Mirrors the production-build job in
      # lint.yml, which only covers pull requests.
      - name: Run production build
        run: npm run build
        env:
          # Match Heroku's build environment (no CI var): hard errors fail the
          # build, pre-existing warnings don't.
          CI: false

      - name: Send verification failure notification to Slack
        if: failure()
        uses: ./.github/actions/slack-notify
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: failure
          environment: production
          release-tag: ${{ github.event.release.tag_name }}
          release-url: ${{ github.event.release.html_url }}

  deploy:
    needs: [verify]
    name: Deploy Frontend to Heroku Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      # Must stay a literal: environment.url rejects the secrets context, which
      # made this workflow unloadable and unrunnable for months.
      url: https://benefits-calculator-v1.herokuapp.com

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Get release info
        id: release_info
        run: |
          echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          echo "name=${{ github.event.release.name }}" >> $GITHUB_OUTPUT

      - name: Send deployment in-progress notification to Slack
        uses: ./.github/actions/slack-notify
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: in-progress
          environment: production
          release-tag: ${{ steps.release_info.outputs.tag }}
          release-name: ${{ steps.release_info.outputs.name }}
          release-url: ${{ github.event.release.html_url }}
          heroku-app-name: ${{ secrets.HEROKU_PROD_APP_NAME }}

      - name: Deploy to Heroku
        uses: ./.github/actions/deploy-to-heroku
        with:
          heroku-api-key: ${{ secrets.HEROKU_API_KEY }}
          heroku-app-name: ${{ secrets.HEROKU_PROD_APP_NAME }}
          heroku-email: ${{ secrets.HEROKU_EMAIL }}

      - name: Send deployment success notification to Slack
        if: success()
        uses: ./.github/actions/slack-notify
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: success
          environment: production
          release-tag: ${{ steps.release_info.outputs.tag }}
          release-name: ${{ steps.release_info.outputs.name }}
          release-url: ${{ github.event.release.html_url }}
          heroku-app-name: ${{ secrets.HEROKU_PROD_APP_NAME }}

      - name: Send deployment failure notification to Slack
        if: failure()
        uses: ./.github/actions/slack-notify
        with:
          slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: failure
          environment: production
          release-tag: ${{ steps.release_info.outputs.tag }}
          release-url: ${{ github.event.release.html_url }}
